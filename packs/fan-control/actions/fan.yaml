# The program is YOURS: /usr/local/sbin/fan-profile (root, mode 755). Register it from your computer with ONE command; it fetches the program's fingerprint from the
# worker, shows you what it may do as root, asks once, then signs and installs it:
#     ct-admin action add packs/fan-control
# If the program changes later, the worker refuses to run it until you run that command again and agree to the new fingerprint.
actions:
  fan-profile:
    description: Sample the fan and temperatures (idle, load) or hold the fan at a fixed speed for three minutes
    run: [/usr/local/sbin/fan-profile, "{mode}", "{rpm}"]
    params:
      mode: {enum: [idle, load, fixed]}
      rpm: {int: [1800, 5500], optional: true}
    writable: [/sys/devices/platform/applesmc.768]     # it writes the fan's speed here, and nothing else on the system
    timeout_s: 360                                       # the load run takes five minutes
