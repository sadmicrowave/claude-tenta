# The core job classes every install starts with. Your own classes are added later with `ct-admin adopt`; they live in your private
# queue repository, not here. Commands are argument lists with typed parameters, never shell text.
classes:
  # A quick health read of the worker. `ct-admin apply` runs it as its test job after an install.
  sys-status:
    tier: auto
    cost: light
    run: [/usr/bin/uptime]
    timeout_s: 30

  # Test-runs one exact command on the worker and measures it, so you can decide whether it is worth offloading. Always needs your approval.
  profile-run:
    kind: profile
    cost: heavy
    accepts_files: true
    max_timeout_s: 600
