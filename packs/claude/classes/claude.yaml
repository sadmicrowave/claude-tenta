# Installed when the install uses Claude (claude.auth is account or api-key). The worker runs the `claude` tool inside the job jail with only the
# read-only tools listed here: it can read the files you attach and answer, and it cannot write, run commands or fetch anything itself.
classes:
  claude-read:
    kind: claude
    tier: approve              # each job waits for `cw-admin approve`: it spends your Claude usage, and the attached files are untrusted text
    cost: medium
    accepts_files: true
    allowed_tools: [Read, Grep, Glob]
    max_turns: 6
    timeout_s: 300
