# What must hold before anything is merged or released. The real-systemd end-to-end test (tests/e2e) needs a full machine and is run by hand with
# scripts/e2e-orbstack; everything else runs here.
name: ci

on:
  push:
    branches: [main]
    tags: ["release-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # the privacy check reads the whole history

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Tools the tests use
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client git
          python -m pip install --quiet pyyaml        # the only runtime dependency of the worker's registry reader (the CLI itself needs nothing)

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Reference pages are current
        run: python scripts/gen-docs --check

      - name: Nothing private in the files or the history
        run: |
          scripts/privacy-check --staged || true     # nothing is staged in CI; the history check below is the real one
          scripts/privacy-check --history

  release-tag:
    # A release tag must point at a commit that passed the tests and whose version files say the same thing as the tag.
    if: startsWith(github.ref, 'refs/tags/release-')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag carries the release notes
        run: |
          # `ct-admin update` shows people the tag's message: it must contain docs/releases/<version>.md, so a re-tag with a short message cannot slip through
          tag="${GITHUB_REF_NAME#release-}"
          git fetch --quiet --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/tag-message.txt
          test -s "docs/releases/${tag}.md" || { echo "docs/releases/${tag}.md is missing"; exit 1; }
          python3 - "docs/releases/${tag}.md" /tmp/tag-message.txt <<'PY' || { echo "the tag message does not contain docs/releases/${tag}.md"; exit 1; }
          import sys
          notes, message = (open(p).read().strip() for p in sys.argv[1:3])
          sys.exit(0 if notes in message else 1)
          PY
      - name: The tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#release-}"
          grep -q "^version = \"$tag\"" pyproject.toml || { echo "pyproject.toml does not say $tag"; exit 1; }
          grep -q "^__version__ = \"$tag\"" src/ct/__init__.py || { echo "src/ct/__init__.py does not say $tag"; exit 1; }
