# What must hold before anything is merged or released. The real-systemd end-to-end test (tests/e2e) needs a full machine and is run by hand with
# scripts/e2e-orbstack; everything else runs here.
name: ci

on:
  push:
    branches: [main]
    tags: ["release-*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-ready:
    # The Windows line is planned (docs/design/WINDOWS-SPECIAL-USE.md). Until it exists this job only keeps the door open: the worker's modules must import with none of the POSIX-only Python modules, and the seam
    # must say plainly what is not written. It does not run the worker.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The worker's modules import, and the seam is honest
        run: python -m unittest tests.test_windows_ready tests.test_platform_seam -v

  test:
    # Linux is where the worker runs; macOS is where the commands on your computer run (ct-run, ct-admin, ct-setup client), so the unit tests run on both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
        include:
          - {os: macos-latest, python: "3.13"}          # one macOS job: GitHub's macOS runners are often over capacity, and a second one only ever queued (3.11 passed there once, on the first run)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # the privacy check reads the whole history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}      # the real commits of the pull request, not the synthetic merge commit GitHub makes (its author is not a noreply address, which the history check rightly refuses)

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Tools the tests use (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client git

      - name: Python packages the tests use
        run: python -m pip install --quiet pyyaml        # the only runtime dependency of the worker's registry reader (the CLI itself needs nothing)

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: The commands on your computer install and start (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv "$RUNNER_TEMP/ctv"
          "$RUNNER_TEMP/ctv/bin/pip" install --quiet .
          for c in ct-run ct-admin ct-setup ct-help; do "$RUNNER_TEMP/ctv/bin/$c" --help >/dev/null || { echo "$c does not start"; exit 1; }; done
          command -v pbcopy ssh-keygen ssh-keyscan arp ifconfig        # what the clipboard copy and the network discovery call on a Mac

      - name: Reference pages are current
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/gen-docs --check

      - name: Nothing private in the files or the history
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          scripts/privacy-check --staged || true     # nothing is staged in CI; the history check below is the real one
          scripts/privacy-check --history

  release-tag:
    # A release tag must point at a commit that passed the tests and whose version files say the same thing as the tag.
    if: startsWith(github.ref, 'refs/tags/release-') && !startsWith(github.ref, 'refs/tags/release-win-')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag carries the release notes
        run: |
          # `ct-admin update` shows people the tag's message: it must contain docs/releases/<version>.md, so a re-tag with a short message cannot slip through
          tag="${GITHUB_REF_NAME#release-}"
          git fetch --quiet --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/tag-message.txt
          test -s "docs/releases/${tag}.md" || { echo "docs/releases/${tag}.md is missing"; exit 1; }
          python3 - "docs/releases/${tag}.md" /tmp/tag-message.txt <<'PY' || { echo "the tag message does not contain docs/releases/${tag}.md"; exit 1; }
          import sys
          notes, message = (open(p).read().strip() for p in sys.argv[1:3])
          sys.exit(0 if notes in message else 1)
          PY
      - name: The tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#release-}"
          grep -q "^version = \"$tag\"" pyproject.toml || { echo "pyproject.toml does not say $tag"; exit 1; }
          grep -q "^__version__ = \"$tag\"" src/ct/__init__.py || { echo "src/ct/__init__.py does not say $tag"; exit 1; }

  release-tag-windows:
    # The Windows line (release-win-X.Y.Z) is its own release: it must point at a commit that passed the tests and the Windows job, and its tag message must carry docs/releases/win-X.Y.Z.md.
    # Its version is not the Linux version, so the version files are not compared.
    if: startsWith(github.ref, 'refs/tags/release-win-')
    needs: [test, windows-ready]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag carries the Windows release notes
        run: |
          ver="${GITHUB_REF_NAME#release-win-}"
          git fetch --quiet --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > /tmp/tag-message.txt
          test -s "docs/releases/win-${ver}.md" || { echo "docs/releases/win-${ver}.md is missing"; exit 1; }
          python3 - "docs/releases/win-${ver}.md" /tmp/tag-message.txt <<'PY' || { echo "the tag message does not contain docs/releases/win-${ver}.md"; exit 1; }
          import sys
          notes, message = (open(p).read().strip() for p in sys.argv[1:3])
          sys.exit(0 if notes in message else 1)
          PY
