[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armada"
version = "0.1.0"
description = "Offload slow jobs from a laptop to a spare Linux machine on your home network"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]          # for the commands on your computer (the registry is YAML). The worker's own code runs on the system python and needs only the standard library plus python3-yaml, which the installer provides

[project.scripts]
ct-run = "ct.client.cli:main"
ct-admin = "ct.admin.cli:main"
ct-setup = "ct.setup.cli:main"
ct-help = "ct.help:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ct.client" = ["ignore_templates/**/*"]
