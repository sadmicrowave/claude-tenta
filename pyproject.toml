[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tenta"
version = "0.1.0"
description = "Offload slow jobs from a laptop to a spare Linux machine on your home network"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []          # standard library only: the config loader must run on a fresh server

[project.scripts]
ct-run = "ct.client.cli:main"
ct-admin = "ct.admin.cli:main"
ct-setup = "ct.setup.cli:main"
ct-help = "ct.help:main"

[tool.setuptools.packages.find]
where = ["src"]
